summary: "我是一名跨学科的研究者，专注于机器人、计算机视觉和 AI 应用，习惯以项目为驱动去解决实际问题。我的工作把技术开发和真实场景中的问题结合起来，尤其关注智能系统与复杂物理环境交互的场合。我喜欢构建和改进涵盖感知、建模与自动化的系统，也特别希望把研究想法转化为可落地的解决方案。技术能力之外，我在跨领域协作、国际团队合作和多语言沟通方面也有优势，能够在不同学科、文化和研究环境之间高效地开展工作。"

