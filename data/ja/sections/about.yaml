summary: "ロボティクス、コンピュータビジョン、AI の応用を軸に、分野をまたいで研究に取り組んでいます。技術開発と現実の課題解決を結びつけること、特に知能システムが複雑な物理環境と関わる場面に関心があります。認識・モデリング・自動化にわたるシステムを構築し改良していくことが好きで、研究のアイデアを実用的なソリューションへつなげることを目指しています。技術面に加えて、分野横断的な協働、国際的なチームでの研究、多言語でのコミュニケーションを強みとしており、異なる分野・文化・研究環境の間で円滑に仕事を進めることができます。"

