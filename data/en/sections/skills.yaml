# Your Skills.
# Give a summary of you each skill in the summary section.
skills:
- name: Python
  logo: /images/sections/skills/python.png
  summary: "Primary language for my research. Proficient in Python for deep learning, computer vision, robot control, data processing, and automation, with libraries such as NumPy and OpenCV."
  categories: ["programming", "ai"]
  url: "https://www.python.org/"

- name: Deep Learning
  logo: /images/sections/skills/deep-learning.svg
  summary: "Design and train neural networks with PyTorch for perception tasks such as classification, segmentation, and rack-slot occupancy prediction. Experienced in applying foundation models (e.g., SAM2) for zero-shot segmentation."
  categories: ["ai", "vision"]
  url: "https://pytorch.org/"

- name: Computer Vision
  logo: /images/sections/skills/computer-vision.svg
  summary: "Image processing and machine vision with OpenCV, from classical methods to deep-learning-based detection and segmentation. Built automatic data collection, clustering, and labeling pipelines for robot perception."
  categories: ["vision", "ai"]
  url: "https://opencv.org/"

- name: Robotic Manipulation
  logo: /images/sections/skills/robotic-manipulation.svg
  summary: "Developing vision-guided pick-and-place systems on robot arms (e.g., UFactory xArm Lite6) for laboratory automation, integrating perception, planning, and control on real hardware."
  categories: ["robotics"]

- name: Motion Planning
  logo: /images/sections/skills/motion-planning.svg
  summary: "Planning collision-free arm motions for pick-and-place and rearrangement tasks, and combining task-level planners with motion-level planning in a closed loop for robust execution and replanning."
  categories: ["robotics"]

- name: Reinforcement Learning
  logo: /images/sections/skills/reinforcement-learning.svg
  summary: "Applying deep reinforcement learning (e.g., D3QN with distributed training) to task-level planning problems such as multi-object rearrangement, validated in both simulation and real-world experiments."
  categories: ["ai", "robotics"]

- name: 3D Perception
  logo: /images/sections/skills/rgbd-sensing.svg
  summary: "Working with RGB-D cameras such as Intel RealSense and point cloud data for object localization, camera calibration, and robot-mounted sensing in manipulation tasks."
  categories: ["vision", "robotics"]

- name: "Signal & Image Processing"
  logo: /images/sections/skills/signal-processing.svg
  summary: "Strong fundamentals in signals and systems, digital image processing, and optical engineering from my optoelectronics background, which underpin my work on imaging and perception systems."
  categories: ["vision"]

- name: C
  logo: /images/sections/skills/c.svg
  summary: "Solid foundation in C from my engineering studies. Used for coursework, microcontroller and hardware-related programming, and algorithm practice."
  categories: ["programming"]

- name: Linux
  logo: /images/sections/skills/linux.png
  summary: "Comfortable working in Linux environments for development and experiments: shell scripting, setting up deep learning environments, and running robot software."
  categories: ["tools"]

- name: Git
  logo: /images/sections/skills/git.png
  summary: "Version control for research code and collaborative development on GitHub, including branching workflows and code review."
  categories: ["tools"]
  url: "https://git-scm.com/"

- name: LaTeX
  logo: /images/sections/skills/latex.svg
  summary: "Writing and typesetting research papers and technical documents with LaTeX, with experience through the peer-review process of robotics journals such as RA-L and IJRR."
  categories: ["tools"]
  url: "https://www.latex-project.org/"
